{% extends "base.html" %}

{% block title %}Server Error – AnemiaScan{% endblock %}

{% block content %}
<div class="card" style="text-align: center; max-width: 600px; margin: 40px auto; padding: 40px 24px;">
  <h1 style="color: var(--alert); font-size: 48px; margin-bottom: 8px;">500</h1>
  <h2>An Unexpected Error Occurred</h2>
  <p class="text-muted" style="margin: 0 auto 24px;">We encountered an unexpected problem processing your request. Please try again shortly.</p>
  <div>
    <a href="{{ url_for('dashboard.dashboard_view') if session.get('user_id') else url_for('auth.auth_view') }}" class="btn btn-primary">Return to home</a>
  </div>
</div>
{% endblock %}
