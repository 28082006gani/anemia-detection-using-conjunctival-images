{% extends "base.html" %}

{% block title %}Page or Report Not Found – AnemiaScan{% endblock %}

{% block content %}
<div class="card" style="text-align: center; max-width: 600px; margin: 40px auto; padding: 40px 24px;">
  <h1 style="color: var(--primary-700); font-size: 48px; margin-bottom: 8px;">404</h1>
  <h2>Record Not Found</h2>
  <p class="text-muted" style="margin: 0 auto 24px;">The requested report or page does not exist or is not accessible to your account.</p>
  <div>
    <a href="{{ url_for('dashboard.dashboard_view') if session.get('user_id') else url_for('auth.auth_view') }}" class="btn btn-primary">Return to dashboard</a>
  </div>
</div>
{% endblock %}
